name: Баг
description: Что-то работает не так, как должно
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
      description: Ответ API, статус, логи
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия или коммит
