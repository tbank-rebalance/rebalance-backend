spring:
  application:
    name: rebalance
  mvc:
    problemdetails:
      enabled: true
  main:
    banner-mode: off
    log-startup-info: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rebalance}
    username: ${DB_USER:rebalance}
    password: ${DB_PASSWORD:rebalance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.rebalance: INFO
    org.springframework.boot.tomcat.TomcatWebServer: INFO
  pattern:
    console: "%d{HH:mm:ss,UTC} %-5level %logger{24} - %msg%n"
