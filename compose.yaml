services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: rebalance
      POSTGRES_USER: ${DB_USER:-rebalance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
